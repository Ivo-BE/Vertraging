<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vertraagd beeld</title>
<meta name="theme-color" content="#000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#fff;font:15px/1.4 system-ui,sans-serif;overflow:hidden}
  #out{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #menu{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:5;text-align:center;padding:24px}
  #menu .box{display:grid;gap:14px;max-width:360px;width:100%}
  #menu h1{margin:0}
  #menu p{color:#aaa;margin:0}
  #menu input{font:700 28px system-ui;text-align:center;letter-spacing:.2em;padding:10px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;text-transform:uppercase}
  #menu button{font:600 18px system-ui;padding:14px 20px;border-radius:12px;border:0;background:#EF8A3A;color:#000}
  #menu button.alt{background:#222;color:#fff;border:1px solid #555}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(0,0,0,.55);display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:4;backdrop-filter:blur(6px)}
  .bar label{font-size:13px;color:#ccc;display:flex;align-items:center;gap:6px}
  .bar input[type=range]{width:120px}
  .bar button{font:600 14px system-ui;padding:9px 12px;border-radius:8px;border:1px solid #555;background:#222;color:#fff}
  .bar button.on{background:#EF8A3A;color:#000;border-color:#EF8A3A}
  #status{position:fixed;top:10px;left:12px;font:700 15px system-ui;background:rgba(0,0,0,.55);padding:5px 10px;border-radius:8px;z-index:4;max-width:80vw}
  #status.live{color:#EF8A3A}
  #camPreview{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;display:none}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="out"></canvas>
<video id="camPreview" muted playsinline autoplay></video>
<div id="status" class="hidden">–</div>

<div id="menu"><div class="box">
  <h1>Vertraagd beeld</h1>
  <p>Kies een code (bv. VNK1) en gebruik dezelfde code op beide toestellen, op dezelfde wifi.</p>
  <input id="room" maxlength="8" placeholder="CODE" value="">
  <button id="btnScreen">Dit is het scherm (iPad)</button>
  <button id="btnCam" class="alt">Dit is de camera (telefoon)</button>
  <button id="btnLocal" class="alt">Camera en scherm op één toestel</button>
  <details id="cfg"><summary style="color:#aaa;cursor:pointer">Verbinding instellen (Supabase, eenmalig per toestel)</summary>
    <div style="display:grid;gap:8px;margin-top:10px">
      <input id="cfgUrl" placeholder="https://xxxx.supabase.co" style="font-size:14px;letter-spacing:0;text-transform:none">
      <input id="cfgKey" placeholder="anon public key" style="font-size:14px;letter-spacing:0;text-transform:none">
      <button id="cfgSave" class="alt">Bewaar</button>
      <p style="font-size:12px">Supabase → Project Settings → API. Alleen nodig voor telefoon → iPad; op beide toestellen invullen.</p>
    </div></details>
</div></div>

<div class="bar hidden" id="bar">
  <label id="delayWrap">Vertraging <input type="range" id="delay" min="2" max="30" step="1" value="10"> <b id="delayVal">10 s</b></label>
  <button id="cam" class="hidden">Camera wisselen</button>
  <button id="rec" class="hidden">● Opnemen</button>
  <button id="pause">Pauze</button>
  <button id="mirror">Spiegel</button>
  <button id="fs">Volledig scherm</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ====== VUL IN: Supabase project (Settings → API). Alleen nodig voor telefoon → iPad. ======
const SUPABASE_URL = localStorage.getItem('vt:url') || '';
const SUPABASE_ANON_KEY = localStorage.getItem('vt:key') || '';
// ==========================================================================================

const $=id=>document.getElementById(id);
const out=$('out'),ctx=out.getContext('2d');
const video=document.createElement('video');video.muted=true;video.playsInline=true;video.autoplay=true;
let stream=null,facing='environment',delay=10,paused=false,mirror=false,mode=null;
const FPS=25;let frames=[],w=640,h=360,timer=null;
let pc=null,channel=null,room='';

$('delay').oninput=e=>{delay=+e.target.value;$('delayVal').textContent=delay+' s'};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Verder':'Pauze';$('pause').classList.toggle('on',paused)};
$('mirror').onclick=()=>{mirror=!mirror;$('mirror').classList.toggle('on',mirror)};
$('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})};
$('cam').onclick=()=>{if(recorder){alert('Stop eerst de opname.');return}facing=facing==='environment'?'user':'environment';startCamera().then(()=>{if(pc)renegotiate()})};

// ---------- opnemen (op het toestel dat filmt)
let recorder=null,chunks=[],recStart=0,recTimer=null;
$('rec').onclick=()=>recorder?stopRec():startRec();
function startRec(){
  if(!stream)return;
  const mime=['video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  try{recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4_000_000})}catch(e){alert('Opnemen wordt niet ondersteund in deze browser.');return}
  chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:recorder.mimeType});const ext=recorder.mimeType.includes('mp4')?'mp4':'webm';
    const d=new Date(),pad=n=>String(n).padStart(2,'0');
    const name=`opname-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.${ext}`;
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
    recorder=null;chunks=[];clearInterval(recTimer);$('rec').textContent='● Opnemen';$('rec').classList.remove('on');
    setStatus(`Opname bewaard: ${name} (${(blob.size/1048576).toFixed(0)} MB)`,false);
  };
  recorder.start(1000);recStart=Date.now();$('rec').classList.add('on');
  recTimer=setInterval(()=>{const s=Math.floor((Date.now()-recStart)/1000);$('rec').textContent=`■ Stop ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},1000);
}
function stopRec(){if(recorder&&recorder.state!=='inactive')recorder.stop()}
window.addEventListener('beforeunload',e=>{if(recorder){e.preventDefault();e.returnValue=''}});
$('room').value=localStorage.getItem('vt:room')||'';
$('cfgUrl').value=SUPABASE_URL;$('cfgKey').value=SUPABASE_ANON_KEY;
if(!SUPABASE_URL||!SUPABASE_ANON_KEY)$('cfg').open=true;
$('cfgSave').onclick=()=>{localStorage.setItem('vt:url',$('cfgUrl').value.trim());localStorage.setItem('vt:key',$('cfgKey').value.trim());location.reload()};

$('btnLocal').onclick=async()=>{mode='local';showUi();$('cam').classList.remove('hidden');$('rec').classList.remove('hidden');await startCamera();startBuffer(video)};
$('btnCam').onclick=async()=>{if(!needRoom())return;mode='cam';showUi();$('cam').classList.remove('hidden');$('rec').classList.remove('hidden');$('delayWrap').classList.add('hidden');$('mirror').classList.add('hidden');$('pause').classList.add('hidden');
  await startCamera();$('camPreview').srcObject=stream;$('camPreview').style.display='block';$('out').style.display='none';joinRoom()};
$('btnScreen').onclick=()=>{if(!needRoom())return;mode='screen';showUi();joinRoom();setStatus('Wacht op camera met code '+room+'…',true)};

function needRoom(){room=$('room').value.trim().toUpperCase();if(!room){alert('Vul eerst een code in.');return false}if(!SUPABASE_URL||!SUPABASE_ANON_KEY){alert('Vul eerst de verbinding in (Supabase URL en key).');$('cfg').open=true;return false}localStorage.setItem('vt:room',room);return true}
function showUi(){$('menu').classList.add('hidden');$('bar').classList.remove('hidden');$('status').classList.remove('hidden')}
function setStatus(t,live){$('status').textContent=t;$('status').className=live?'live':''}

// ---------- camera
async function startCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false})}
  catch(e){alert('Geen toegang tot de camera: '+e.message+'. Dit werkt alleen via https.');location.reload();return}
  video.srcObject=stream;await video.play();
}

// ---------- vertragingsbuffer (op het scherm-toestel)
function startBuffer(src){
  frames=[];
  const size=()=>{const vw=src.videoWidth||1280,vh=src.videoHeight||720;const scale=Math.min(1,960/Math.max(vw,vh));w=Math.round(vw*scale);h=Math.round(vh*scale);out.width=w;out.height=h};
  size();src.addEventListener('resize',size);
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{
    if(paused||src.readyState<2)return;
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(src,0,0,w,h);
    frames.push({t:performance.now(),c});
    const maxAge=(delay+1)*1000;while(frames.length&&frames[0].t<performance.now()-maxAge)frames.shift();
  },1000/FPS);
  requestAnimationFrame(draw);
}
function draw(){
  const now=performance.now(),target=now-delay*1000;
  let f=null;for(const x of frames){if(x.t<=target)f=x;else break}
  if(f){ctx.save();if(mirror){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(f.c,0,0);ctx.restore();setStatus(`Vertraging ${delay} s`,false)}
  else{const have=frames.length?(now-frames[0].t)/1000:0;setStatus(`Buffer vult… ${Math.min(delay,have).toFixed(0)} / ${delay} s`,true);ctx.fillStyle='#000';ctx.fillRect(0,0,w,h)}
  requestAnimationFrame(draw);
}
document.addEventListener('visibilitychange',()=>{if(mode==='local'||mode==='screen'){if(document.hidden)paused=true;else{paused=false;frames=[]}}});

// ---------- verbinding telefoon -> iPad (WebRTC, signalering via Supabase Realtime)
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
function joinRoom(){
  const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  channel=sb.channel('vertraging:'+room,{config:{broadcast:{self:false}}});
  channel.on('broadcast',{event:'sig'},({payload})=>onSignal(payload)).subscribe(st=>{
    if(st==='SUBSCRIBED'){if(mode==='screen')send({type:'want'});else setStatus('Camera klaar, code '+room+'. Wacht op scherm…',true)}
  });
}
const send=msg=>channel.send({type:'broadcast',event:'sig',payload:{...msg,from:mode}});
function newPc(){
  if(pc)pc.close();
  pc=new RTCPeerConnection(ICE);
  pc.onicecandidate=e=>{if(e.candidate)send({type:'ice',cand:e.candidate})};
  pc.onconnectionstatechange=()=>{
    if(pc.connectionState==='connected')setStatus(mode==='cam'?'Verbonden met scherm':'Verbonden – buffer vult…',true);
    if(['failed','disconnected'].includes(pc.connectionState)){setStatus('Verbinding verbroken, opnieuw proberen…',true);if(mode==='screen')setTimeout(()=>send({type:'want'}),1500)}
  };
  if(mode==='screen')pc.ontrack=e=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.autoplay=true;v.srcObject=e.streams[0];v.play().then(()=>startBuffer(v))};
  return pc;
}
async function renegotiate(){newPc();stream.getTracks().forEach(t=>pc.addTrack(t,stream));const o=await pc.createOffer();await pc.setLocalDescription(o);send({type:'offer',sdp:o})}
async function onSignal(m){
  if(m.from===mode)return;
  if(mode==='cam'){
    if(m.type==='want'){if(!stream)return;await renegotiate()}
    else if(m.type==='answer'&&pc){await pc.setRemoteDescription(m.sdp)}
    else if(m.type==='ice'&&pc){try{await pc.addIceCandidate(m.cand)}catch(e){}}
  }else if(mode==='screen'){
    if(m.type==='offer'){newPc();await pc.setRemoteDescription(m.sdp);const a=await pc.createAnswer();await pc.setLocalDescription(a);send({type:'answer',sdp:a})}
    else if(m.type==='ice'&&pc){try{await pc.addIceCandidate(m.cand)}catch(e){}}
  }
}
</script>
</body>
</html>
