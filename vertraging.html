<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vertraagd beeld</title>
<meta name="theme-color" content="#000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#fff;font:15px/1.4 system-ui,sans-serif;overflow:hidden}
  #out{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #start{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:5;text-align:center;padding:24px}
  #start button{font:600 20px system-ui;padding:16px 28px;border-radius:12px;border:0;background:#EF8A3A;color:#000}
  #start p{color:#aaa;max-width:340px}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(0,0,0,.55);display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:4;backdrop-filter:blur(6px)}
  .bar label{font-size:13px;color:#ccc;display:flex;align-items:center;gap:6px}
  .bar input[type=range]{width:120px}
  .bar button{font:600 14px system-ui;padding:9px 12px;border-radius:8px;border:1px solid #555;background:#222;color:#fff}
  .bar button.on{background:#EF8A3A;color:#000;border-color:#EF8A3A}
  #status{position:fixed;top:10px;left:12px;font:700 15px system-ui;background:rgba(0,0,0,.55);padding:5px 10px;border-radius:8px;z-index:4}
  #status.live{color:#EF8A3A}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="out"></canvas>
<div id="status">–</div>
<div id="start">
  <div><h1>Vertraagd beeld</h1>
    <p>Zet de telefoon op een statief richting het veld. De speler ziet zichzelf na de ingestelde vertraging.</p>
    <button id="go">Camera starten</button></div>
</div>
<div class="bar">
  <label>Vertraging <input type="range" id="delay" min="2" max="30" step="1" value="10"> <b id="delayVal">10 s</b></label>
  <button id="cam">Camera wisselen</button>
  <button id="pause">Pauze</button>
  <button id="mirror">Spiegel</button>
  <button id="fs">Volledig scherm</button>
</div>
<script>
const out=document.getElementById('out'),ctx=out.getContext('2d');
const video=document.createElement('video');video.muted=true;video.playsInline=true;
let stream=null,facing='environment',delay=10,paused=false,mirror=false;
const FPS=25;let frames=[],w=640,h=360,timer=null;
const $=id=>document.getElementById(id);

$('delay').oninput=e=>{delay=+e.target.value;$('delayVal').textContent=delay+' s'};
$('cam').onclick=()=>{facing=facing==='environment'?'user':'environment';start()};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Verder':'Pauze';$('pause').classList.toggle('on',paused)};
$('mirror').onclick=()=>{mirror=!mirror;$('mirror').classList.toggle('on',mirror)};
$('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})};
$('go').onclick=()=>{$('start').classList.add('hidden');start()};

async function start(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  frames=[];
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false});
  }catch(e){$('start').classList.remove('hidden');$('start').querySelector('p').textContent='Geen toegang tot de camera: '+e.message+'. Dit werkt alleen via https.';return}
  video.srcObject=stream;await video.play();
  const s=stream.getVideoTracks()[0].getSettings();
  // buffer op beperkte resolutie om geheugen te sparen (30 s × 25 fps)
  const scale=Math.min(1,960/Math.max(s.width||1280,s.height||720));
  w=Math.round((s.width||1280)*scale);h=Math.round((s.height||720)*scale);
  out.width=w;out.height=h;
  if(timer)clearInterval(timer);
  timer=setInterval(capture,1000/FPS);
  requestAnimationFrame(draw);
}
function capture(){
  if(paused||video.readyState<2)return;
  const c=new OffscreenCanvas(w,h);c.getContext('2d').drawImage(video,0,0,w,h);
  frames.push({t:performance.now(),c});
  const maxAge=(delay+1)*1000;
  while(frames.length&&frames[0].t<performance.now()-maxAge)frames.shift();
}
function draw(){
  const now=performance.now();
  const target=now-delay*1000;
  let f=null;for(const x of frames){if(x.t<=target)f=x;else break}
  if(f){ctx.save();if(mirror){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(f.c,0,0);ctx.restore();
    $('status').textContent=`Vertraging ${delay} s`;$('status').className='';}
  else{
    const have=frames.length?(now-frames[0].t)/1000:0;
    $('status').textContent=`Buffer vult… ${Math.min(delay,have).toFixed(0)} / ${delay} s`;$('status').className='live';
    ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
  }
  requestAnimationFrame(draw);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true}else{paused=false;frames=[]}});
</script>
</body>
</html>
